<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b14">
<link rel="manifest" href="manifest.webmanifest">
<title>NRG Cables · PLUP</title>
<style>
:root{
  --bg0:#02070d; --bg1:#061524; --bg2:#08263b;
  --panel:#071a2b; --panel2:#0a2238; --line:#27516f;
  --text:#f5f8fb; --muted:#b5c6d5;
  --cyan:#26a9ff; --blue:#198ff2; --green:#28db73; --orange:#ff7a1c; --silver:#c7d3dd;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--text);font:14px/1.35 Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 8%,rgba(22,100,181,.28),transparent 23%),
    radial-gradient(circle at 88% 18%,rgba(16,191,145,.12),transparent 18%),
    radial-gradient(circle at 75% 85%,rgba(45,109,255,.12),transparent 20%),
    linear-gradient(135deg,#02060b 0%,#06131f 42%,#03101a 68%,#010408 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;
  background:
    repeating-linear-gradient(135deg,transparent 0 92px,rgba(81,141,190,.24) 92px 94px,transparent 94px 186px),
    repeating-linear-gradient(45deg,transparent 0 150px,rgba(23,73,116,.20) 150px 152px,transparent 152px 305px);
}
main{max-width:1320px;margin:auto;padding:18px}
.editor,.report{
  background:linear-gradient(160deg,rgba(8,27,44,.98),rgba(4,16,27,.99));
  border:1px solid #23445e;border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.42);
  overflow:hidden;margin-bottom:18px;
}
.editor{padding:20px}
.report{padding:18px}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:18px}
.logoText{display:flex;align-items:center;gap:17px}
.nrg{font-size:30px;font-weight:1000;letter-spacing:1px}
.nrg small{display:block;font-size:10px;letter-spacing:6px;text-align:center}
.vline{width:1px;height:58px;background:#9ab4c9}
.plup{font-size:30px;font-weight:900}.plup small{display:block;font-size:12px;letter-spacing:3px;margin-top:3px}
.stripes{display:flex;gap:7px;transform:skew(-32deg);margin-right:8px}
.stripes i{display:block;width:21px;height:70px}
.stripes i:nth-child(1){background:#1592f5}.stripes i:nth-child(2){background:#0d5fa9}.stripes i:nth-child(3){background:#30ce74}

.tabs{display:flex;gap:10px;margin-top:16px}
.tabs button,.primary{
  border:1px solid #2c5c7e;border-radius:13px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;
  background:#102a40;color:#dce8f1
}
.tabs button{flex:1}.tabs .on,.primary{color:white;background:linear-gradient(135deg,#0e5f9f,#083e68);box-shadow:0 0 18px rgba(18,126,234,.15)}
.day{border:1px solid #254861;border-radius:16px;padding:14px;margin-top:14px;background:#061927cc}
.day h3{margin:0 0 10px}.sectionTitle{margin:15px 0 8px;padding-bottom:7px;border-bottom:1px solid #294d68;color:#9fd4ff;font-weight:900}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:12px;font-weight:700;color:#c7d8e7}
input{width:100%;margin-top:5px;padding:12px;border:1px solid #315e7b;border-radius:10px;background:#0a2236;color:white;font-size:15px;outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(38,169,255,.16)}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.pdf-status{text-align:center;min-height:18px;margin-top:8px;color:#8ff0b7;font-weight:700}

.reportTop{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
.hero{
  position:relative;height:160px;border-radius:18px;overflow:hidden;border:1px solid #198fe0;
  background:linear-gradient(90deg,#073d67 0%,#062f50 42%,#031c30 70%,#04111d 100%);
  box-shadow:0 0 22px rgba(27,148,232,.13);
}
.heroContent{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:20px;z-index:2}
.docicon{font-size:54px;padding-right:20px;border-right:2px solid rgba(255,255,255,.65)}
.hero h1{margin:0;font-size:44px}.hero p{margin:8px 0 0;font-size:21px}
.heroArt{position:absolute;right:0;top:0;width:62%;height:100%}.heroArt svg{width:100%;height:100%;display:block}

.landscapeGrid{display:grid;grid-template-columns:1.12fr .88fr;gap:12px;margin-top:12px}
.leftStack{display:grid;gap:12px}
.materialRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px;min-height:168px}
.card:after{position:absolute;right:-8px;top:4px;font-size:100px;font-weight:900;opacity:.055}
.al{background:linear-gradient(145deg,rgba(8,70,116,.96),rgba(5,37,61,.98));border:1px solid #279fff}.al:after{content:"Al"}
.cu{background:linear-gradient(145deg,rgba(73,43,19,.94),rgba(31,26,24,.98));border:1px solid #d57b33}.cu:after{content:"Cu"}
.cardHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.atom{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900}
.al .atom{background:linear-gradient(145deg,#2fb0ff,#0f7bf1)}.cu .atom{background:linear-gradient(145deg,#ffa349,#ff6c11)}
.card h2{font-size:24px;margin:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:2px 8px}.metric+.metric{border-left:1px solid rgba(151,177,197,.38)}
.metric span{font-size:15px}.big{font-size:30px;font-weight:900;margin-top:5px}.blue{color:var(--cyan)}.orange{color:var(--orange)}.sub{font-size:14px;color:#8ebde1}

.sum{display:grid;grid-template-columns:1fr 1fr;border:1px solid #22dd76;border-radius:16px;background:linear-gradient(135deg,#06472f,#032d25);text-align:center}
.sum>div{padding:18px}.sum>div+div{border-left:1px solid rgba(106,223,155,.38)}.sum span{font-size:17px;font-weight:800}.sum b{display:block;color:#64f29f;font-size:32px;margin-top:5px}

.waste{border:1px solid #477fa6;border-radius:16px;padding:16px;background:linear-gradient(145deg,#0a2e49,#061b2c)}
.waste h2{margin:0 0 10px;font-size:24px}.wasteGrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:15px;align-items:center}
.wleft{padding-right:14px;border-right:1px solid rgba(92,122,145,.5)}.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0}.line.total{border-top:1px solid rgba(104,132,154,.5);margin-top:4px;padding-top:12px}
.ringWrap{display:grid;grid-template-columns:135px 1fr;gap:14px;align-items:center}.donutBox{width:135px;height:135px}.donutBox svg{width:135px;height:135px}.legend div{margin:10px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}.greenDot{background:var(--green)}.greyDot{background:var(--silver)}
.bottom{display:grid;grid-template-columns:1fr 1fr;border:1px solid #1a9eef;border-radius:16px;background:linear-gradient(135deg,#0a5a94,#05375e);text-align:center}
.bottom>div{padding:17px}.bottom>div+div{border-left:1px solid rgba(145,199,233,.4)}.bottom span{font-size:17px}.bottom b{display:block;font-size:33px;margin-top:5px}

.ops{border:1px solid #305e7d;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#092b45,#061b2c);height:100%}
.opsHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(90deg,#0d4e7e,#082e4c);font-size:22px;font-weight:900}
.opsDate{font-size:14px;padding:7px 10px;border:1px solid #3575a2;border-radius:9px;background:#0b385d}
.opsGrid{display:grid;grid-template-columns:1.05fr 1fr}.opsLabel,.opsValue{padding:8px 10px;border-bottom:1px solid rgba(98,129,152,.28)}
.opsLabel{color:#d1deea}.opsValue{text-align:right;font-weight:800}.greenVal{color:#61efa0}.blueVal{color:#49b0ff}

.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px;padding:8px 14px;color:#dce7ef;letter-spacing:3px;font-weight:800;border-top:1px solid #2b526e}
.footerStripes{display:flex;gap:5px;transform:skew(-32deg)}.footerStripes i{display:block;width:10px;height:28px}.footerStripes i:nth-child(1){background:#1592f5}.footerStripes i:nth-child(2){background:#0d5fa9}.footerStripes i:nth-child(3){background:#30ce74}
.sep{margin:16px 0 0;padding-top:12px;border-top:2px solid #31526b;font-size:18px;font-weight:900;color:#b6e0ff}

@media(max-width:900px){
  .landscapeGrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.materialRow{grid-template-columns:1fr}
  .report{padding:12px}.hero{height:140px}.hero h1{font-size:34px}.heroArt{width:48%}.heroContent{left:16px}.docicon{font-size:42px}
  .wasteGrid,.ringWrap{grid-template-columns:1fr}.wleft{border-right:0;border-bottom:1px solid rgba(92,122,145,.5);padding-bottom:10px}
}
</style>
</head>
<body>
<main>
<section class="editor" id="editor">
  <div class="brandbar">
    <div class="logoText"><div class="nrg">NRG<small>CABLES</small></div><div class="vline"></div><div class="plup">PLUP<small>DEPARTAMENT</small></div></div>
    <div class="stripes"><i></i><i></i><i></i></div>
  </div>
  <div class="tabs"><button id="m1" class="on">1 ZI</button><button id="m3">3 ZILE</button></div>
  <div id="days"></div>
  <div class="actions"><button id="update" class="primary">ACTUALIZEAZĂ</button><button id="pdf" class="primary">GENEREAZĂ PDF</button></div>
  <div id="pdfStatus" class="pdf-status"></div>
</section>

<section class="report" id="report"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let mode=1;
const dn=["Vineri","Sâmbătă","Duminică"];
const BASE=[
 ["Data","date"],["Aluminiu predat (t)","al"],["Cupru predat (t)","cu"],
 ["Backlog aluminiu (t)","bal"],["Backlog cupru (t)","bcu"],
 ["Deșeu aluminiu (t)","wal"],["Deșeu cupru (t)","wcu"],["Observații","obs"]
];
const OPS=[
 ["Asumat / Realizat (t) + %","op_asumreal"],["Realizat VS Status","op_status"],["Realizat vs Plan","op_plan"],["Previz sch 1","op_previz"],
 ["Backlog Aluminiu (t)","op_backal"],["Backlog Cupru (t)","op_backcu"],["SF așteptare – Rigid 1 (km)","op_rigid1"],["SF așteptare – Rigid 2 (km)","op_rigid2"],
 ["SF așteptare – Rigid 3 (km)","op_rigid3"],["SF așteptare – Multifir 8 Cai 1 (t)","op_multi1"],["SF așteptare – Multifir 8 Cai 2 (t)","op_multi2"],
 ["SF așteptare – 16 Cai Niehoff (t)","op_niehoff"],["SF așteptare – 16 Cai Beta 3 (t)","op_beta3"],["Stoc Al","op_stocal"],["Stoc Cu","op_stoccu"]
];

const $=id=>document.getElementById(id),days=$("days"),report=$("report"),m1=$("m1"),m3=$("m3"),update=$("update"),pdf=$("pdf"),pdfStatus=$("pdfStatus");
const pad=v=>String(v).padStart(2,"0");
function dateRO(dt=new Date()){return `${pad(dt.getDate())}.${pad(dt.getMonth()+1)}.${dt.getFullYear()}`}
function addDaysRO(ro,add){const p=ro.split(".");if(p.length!==3)return ro;const x=new Date(+p[2],+p[1]-1,+p[0]);x.setDate(x.getDate()+add);return dateRO(x)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function input(label,id,v=""){return `<label>${label}<input id="${id}" type="text" inputmode="text" value="${esc(v)}"></label>`}
function form(){
 const t=dateRO();
 days.innerHTML=Array.from({length:mode},(_,i)=>`<div class="day"><h3>${mode===1?"Ziua":dn[i]}</h3>
 <div class="sectionTitle">Date raport</div><div class="fields">${BASE.map(([a,b])=>input(a,b+i,b==="date"?(mode===1?t:addDaysRO(t,i)):"")).join("")}</div>
 <div class="sectionTitle">Indicatori operaționali</div><div class="fields">${OPS.map(([a,b])=>input(a,b+i,"")).join("")}</div></div>`).join("");
 restore();
}
function n(id){return parseFloat(($(id)?.value||"0").replace(",","."))||0}
function txt(id){return $(id)?.value||""}
function d(i){const o={date:txt("date"+i),al:n("al"+i),cu:n("cu"+i),bal:n("bal"+i),bcu:n("bcu"+i),wal:n("wal"+i),wcu:n("wcu"+i),obs:txt("obs"+i)};OPS.forEach(([,k])=>o[k]=txt(k+i));return o}
function f(x){return (Math.round(x*10)/10).toFixed(1).replace(".0","")}
function brand(){return `<div class="brandbar"><div class="logoText"><div class="nrg">NRG<small>CABLES</small></div><div class="vline"></div><div class="plup">PLUP<small>DEPARTAMENT</small></div></div><div class="stripes"><i></i><i></i><i></i></div></div>`}
function cableSVG(){
 return `<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg"><defs>
 <linearGradient id="cu" x1="0" x2="1"><stop offset="0" stop-color="#f6ba75"/><stop offset=".48" stop-color="#b45b29"/><stop offset="1" stop-color="#5c2812"/></linearGradient>
 <linearGradient id="al" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f7fa"/><stop offset=".45" stop-color="#bdcad3"/><stop offset="1" stop-color="#718696"/></linearGradient>
 <pattern id="braid" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><rect width="14" height="14" fill="url(#al)"/><path d="M0 7H14" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M7 0V14" stroke="#516779" stroke-opacity=".45" stroke-width="2"/></pattern>
 <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter></defs>
 <g transform="translate(70 0) rotate(-10 360 110)" filter="url(#sh)">
 ${Array.from({length:8},(_,k)=>`<g><rect x="${195-k*7}" y="${20+k*23}" width="${390-k*18}" height="17" rx="8.5" fill="url(#braid)"/><rect x="${160-k*7}" y="${22+k*23}" width="39" height="13" rx="6.5" fill="url(#cu)"/></g>`).join("")}
 </g></svg>`;
}
function hero(title){return `<div class="hero"><div class="heroContent"><div class="docicon">▤</div><div><h1>Raport</h1><p>▣ ${esc(title)}</p></div></div><div class="heroArt">${cableSVG()}</div></div>`}
function donutSVG(p){
 const pct=Math.max(0,Math.min(100,p)),r=49,c=2*Math.PI*r,d=(pct/100)*c;
 return `<div class="donutBox"><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#c7d3dd" stroke-width="17"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="#28db73" stroke-width="17" stroke-dasharray="${d} ${c-d}" transform="rotate(-90 65 65)"/><circle cx="65" cy="65" r="34" fill="#0a2238"/><text x="65" y="63" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">${pct.toFixed(1)}%</text><text x="65" y="79" text-anchor="middle" fill="#eaf2f8" font-size="10">Procent deșeu</text></svg></div>`;
}
function opsTable(x){
 return `<div class="ops"><div class="opsHead"><span>▥ Indicatori operaționali</span><span class="opsDate">▣ ${esc(x.date)}</span></div><div class="opsGrid">${
 OPS.map(([l,k],idx)=>`<div class="opsLabel">${esc(l)}</div><div class="opsValue ${(idx<3?"greenVal":k==="op_rigid1"?"blueVal":"")}">${esc(x[k]||"-")}</div>`).join("")
 }</div></div>`;
}
function leftPanels(x){
 const pred=x.al+x.cu,back=x.bal+x.bcu,w=x.wal+x.wcu,proc=pred+w,p=proc?w/proc*100:0,mat=proc-w;
 return `<div class="leftStack">
 <div class="materialRow">
  <div class="card al"><div class="cardHead"><div class="atom">Al</div><h2>Aluminiu</h2></div><div class="row2"><div class="metric"><span>▰ Predat</span><div class="big">${f(x.al)} t</div></div><div class="metric"><span>◇ Backlog</span><div class="big blue">${f(x.bal)} t</div><div class="sub">[ ${f(x.bal)} t ]</div></div></div></div>
  <div class="card cu"><div class="cardHead"><div class="atom">Cu</div><h2>Cupru</h2></div><div class="row2"><div class="metric"><span>▰ Predat</span><div class="big">${f(x.cu)} t</div></div><div class="metric"><span>◇ Backlog</span><div class="big orange">${f(x.bcu)} t</div><div class="sub">[ ${f(x.bcu)} t ]</div></div></div></div>
 </div>
 <div class="sum"><div><span>✓ Total predat AL + CU</span><b>${f(pred)} t</b></div><div><span>▣ Backlog predat</span><b>${f(back)} t</b></div></div>
 <div class="waste"><h2>♻ Deșeu</h2><div class="wasteGrid"><div class="wleft"><div class="line"><span>🔵 Aluminiu</span><b>${f(x.wal)} t</b></div><div class="line"><span>🟠 Cupru</span><b>${f(x.wcu)} t</b></div><div class="line total"><span>♻ Total deșeu</span><b>${f(w)} t</b></div>${x.obs?`<div class="line"><span>Obs.</span><span>${esc(x.obs)}</span></div>`:""}</div><div class="ringWrap">${donutSVG(p)}<div class="legend"><div><i class="dot greenDot"></i>Deșeu<br><b>${f(w)} t (${p.toFixed(1)}%)</b></div><div><i class="dot greyDot"></i>Material procesat<br><b>${f(mat)} t (${(100-p).toFixed(1)}%)</b></div></div></div></div></div>
 <div class="bottom"><div><span>↗ Total procesat</span><b>${f(proc)} t</b></div><div><span>% Procent deșeu</span><b>${p.toFixed(1)}%</b></div></div>
 </div>`;
}
function reportPage(x,title){
 return `${brand()}${hero(title)}<div class="landscapeGrid">${leftPanels(x)}${opsTable(x)}</div><div class="footer"><span>NRG CABLES │ PLUP DEPARTMENT</span><div class="footerStripes"><i></i><i></i><i></i></div></div>`;
}
function getData(){return Array.from({length:mode},(_,i)=>d(i))}
function total(a){const z=a.reduce((q,x)=>({date:"",al:q.al+x.al,cu:q.cu+x.cu,bal:q.bal+x.bal,bcu:q.bcu+x.bcu,wal:q.wal+x.wal,wcu:q.wcu+x.wcu,obs:""}),{al:0,cu:0,bal:0,bcu:0,wal:0,wcu:0});OPS.forEach(([,k])=>z[k]="");return z}
function build(){
 const a=getData();
 if(mode===1)report.innerHTML=reportPage(a[0],a[0].date);
 else{
  report.innerHTML=a.map((x,i)=>`${i?`<div class="sep">${dn[i]}</div>`:""}${reportPage(x,x.date)}`).join("")+`<div class="sep">TOTAL WEEKEND</div>${reportPage(total(a),`${a[0].date} – ${a[2].date}`)}`;
 }
 save();
}
function save(){const v={mode};document.querySelectorAll("input").forEach(x=>v[x.id]=x.value);localStorage.setItem("plupData",JSON.stringify(v))}
function restore(){try{const v=JSON.parse(localStorage.getItem("plupData")||"{}");document.querySelectorAll("input").forEach(x=>{if(v[x.id]!=null)x.value=v[x.id]})}catch(e){}}
function setMode(v){mode=v;m1.classList.toggle("on",v===1);m3.classList.toggle("on",v===3);form();build()}
async function canvasOf(el){return html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#02070d",logging:false,windowWidth:1320})}
async function addCanvasLandscape(doc,canvas,newPage=false){
 if(newPage)doc.addPage("a4","landscape");
 const pw=297,ph=210,m=5;let w=pw-m*2,h=canvas.height*w/canvas.width;if(h>ph-m*2){h=ph-m*2;w=canvas.width*h/canvas.height}
 doc.addImage(canvas.toDataURL("image/png"),"PNG",(pw-w)/2,m,w,h)
}
async function generatePDF(){
 build();
 if(!window.html2canvas||!window.jspdf){pdfStatus.textContent="Bibliotecile PDF nu s-au încărcat.";return}
 pdf.disabled=true;const old=pdf.textContent;pdf.textContent="SE GENEREAZĂ...";pdfStatus.textContent="Pregătesc PDF landscape...";
 try{
  const a=getData(),{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
  if(mode===1){const temp=document.createElement("section");temp.className="report";temp.style.cssText="position:fixed;left:-10000px;top:0;width:1280px";temp.innerHTML=reportPage(a[0],a[0].date);document.body.appendChild(temp);await addCanvasLandscape(doc,await canvasOf(temp));temp.remove();doc.save(`Raport_PLUP_${a[0].date.replaceAll(".","-")}.pdf`)}
  else{
   const pages=[...a.map((x,i)=>({x,t:`${dn[i]} · ${x.date}`})),{x:total(a),t:`TOTAL WEEKEND · ${a[0].date} – ${a[2].date}`}];
   const temp=document.createElement("section");temp.className="report";temp.style.cssText="position:fixed;left:-10000px;top:0;width:1280px";document.body.appendChild(temp);
   for(let i=0;i<pages.length;i++){temp.innerHTML=reportPage(pages[i].x,pages[i].t);await addCanvasLandscape(doc,await canvasOf(temp),i>0)}
   temp.remove();doc.save(`Raport_PLUP_Weekend_${a[0].date.replaceAll(".","-")}.pdf`)
  }
  pdfStatus.textContent="PDF generat cu succes.";
 }catch(e){console.error(e);pdfStatus.textContent="Eroare la generarea PDF."}
 finally{pdf.disabled=false;pdf.textContent=old;setTimeout(()=>pdfStatus.textContent="",3000)}
}
m1.onclick=()=>setMode(1);m3.onclick=()=>setMode(3);update.onclick=build;pdf.onclick=generatePDF;
try{const s=JSON.parse(localStorage.getItem("plupData")||"{}");if(s.mode===3)mode=3}catch(e){}
